<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizKart.in - Daily Skill Quiz & Prize Platform</title>
    <meta name="description" content="QuizKart.in - Skill-based daily quiz platform to win e-commerce products and UPI cashbacks with 100% financial transparency." />
    <meta property="og:title" content="QuizKart.in - Daily Skill Quiz & Prize Platform" />
    <meta property="og:description" content="Test your knowledge in 10 questions in 10 minutes. Win real products and instant UPI cashbacks daily!" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#4878F4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QuizKart" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root">
      <div id="initial-splash-screen" style="position: fixed; inset: 0; width: 100%; height: 100%; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: space-between; z-index: 99999; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 48px 16px 36px;">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <!-- Compact Square Rounded-Corner 'Q' Logo Badge (Exact 1:1 Aspect Ratio) -->
          <div style="width: 76px; height: 76px; min-width: 76px; min-height: 76px; max-width: 76px; max-height: 76px; aspect-ratio: 1 / 1; border-radius: 20px; background: linear-gradient(135deg, #4878F4 0%, #407EF5 25%, #3B8DDF 50%, #2998C6 75%, #19ABA0 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(72, 120, 244, 0.28); margin-bottom: 16px;">
            <span style="font-size: 40px; font-weight: 900; color: #FFFFFF; line-height: 1; user-select: none;">Q</span>
          </div>
          <div style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(135deg, #5F69EF 0%, #417CF4 35%, #3A81F5 65%, #20A5AC 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            QuizKart
          </div>
        </div>
        <!-- Splash Screen Footer Text at bottom center -->
        <div style="font-size: 13px; font-weight: 500; color: #64748B; text-align: center; letter-spacing: 0.2px;">
          Developed by QuizKart Team
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
